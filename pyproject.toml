[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "escalonador-pods-kubernetes"
version = "0.1.0"
description = "Scheduler customizado para Pods Kubernetes usando CPU, memoria, disco e latencia simulada."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "kubernetes>=29.0.0,<34.0.0",
  "pyyaml>=6.0.0"
]

[project.scripts]
sisop-scheduler = "scheduler_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
