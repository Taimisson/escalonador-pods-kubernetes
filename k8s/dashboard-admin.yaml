# usuário admin pro Kubernetes Dashboard.
# o Dashboard sobe sem permissão de ver nada; isso aqui cria uma ServiceAccount
# com acesso total (cluster-admin) só pra eu conseguir logar e visualizar o cluster.
# uso o token dela no login: kubectl -n kubernetes-dashboard create token admin-user
apiVersion: v1
kind: ServiceAccount
metadata:
  name: admin-user
  namespace: kubernetes-dashboard
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: admin-user
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: admin-user
    namespace: kubernetes-dashboard
