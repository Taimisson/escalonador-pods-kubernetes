# bateria de teste do scheduler PADRÃO do Kubernetes.
# 15 Pods com perfis variados (light, balanced, cpu, memory, storage, latency).
# o par custom-scheduler-pods.yaml é idêntico, só muda o schedulerName,
# pra dar pra comparar as duas estratégias nas mesmas condições.
apiVersion: v1
kind: List
items:
  - apiVersion: v1
    kind: Pod
    metadata:
      name: default-light-01
      namespace: scheduler-lab
      labels: {app: scheduler-lab, scheduler.lab/workload: test, scheduler.lab/batch: default, scheduler.lab/profile: light}
      annotations: {scheduler.lab/profile: light}
    spec:
      schedulerName: default-scheduler
      terminationGracePeriodSeconds: 0
      containers:
        - name: workload
          image: registry.k8s.io/pause:3.10
          resources:
            requests: {cpu: 100m, memory: 64Mi, ephemeral-storage: 50Mi}
            limits: {cpu: 200m, memory: 128Mi, ephemeral-storage: 100Mi}
  - apiVersion: v1
    kind: Pod
    metadata:
      name: default-light-02
      namespace: scheduler-lab
      labels: {app: scheduler-lab, scheduler.lab/workload: test, scheduler.lab/batch: default, scheduler.lab/profile: light}
