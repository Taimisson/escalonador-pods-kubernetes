      terminationGracePeriodSeconds: 0
      containers:
        - name: workload
          image: registry.k8s.io/pause:3.10
          resources:
            requests: {cpu: 150m, memory: 96Mi, ephemeral-storage: 80Mi}
            limits: {cpu: 300m, memory: 192Mi, ephemeral-storage: 160Mi}
